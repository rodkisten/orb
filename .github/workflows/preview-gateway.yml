name: 🪐 ORB · Preview Gateway
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [validate, pilot]
        default: validate
permissions:
  contents: read
concurrency:
  group: orb-preview-gateway
  cancel-in-progress: false
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate gateway bundle
        run: pnpm --filter @orb/api exec wrangler deploy --config wrangler.gateway.jsonc --dry-run
      - name: Deploy isolated pilot
        if: inputs.mode == 'pilot' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --filter @orb/api exec wrangler d1 migrations apply ORB_DB --remote --config wrangler.jsonc
          pnpm --filter @orb/api exec wrangler deploy --config wrangler.gateway.pilot.jsonc
      - name: Verify pilot hostname
        if: inputs.mode == 'pilot' && github.ref == 'refs/heads/main'
        run: |
          code=$(curl --retry 5 --retry-all-errors --max-time 20 --silent --show-error --output /tmp/gateway-response --write-out '%{http_code}' https://sandbox-pr15.migos.club/)
          case "$code" in 200|404|503) ;; *) cat /tmp/gateway-response; exit 1;; esac
          echo "Pilot HTTP status: $code" >> "$GITHUB_STEP_SUMMARY"
