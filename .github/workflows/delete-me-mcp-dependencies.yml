name: DELETE ME - MCP dependencies
on:
  workflow_dispatch:
  push:
    branches: [feat/workflow-dispatch-mcp]
    paths:
      - .github/workflows/delete-me-mcp-dependencies.yml
      - apps/api/src/mcp/**
      - apps/api/src/index.ts
      - apps/api/src/github-dispatch.ts
permissions:
  contents: read
concurrency:
  group: orb-mcp-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/workflow-dispatch-mcp'
    steps:
      - uses: actions/create-github-app-token@v2
        id: ploocky
        with:
          app-id: "5784353"
          private-key: ${{ secrets.PLOOCKY_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.ploocky.outputs.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm --filter @orb/api add @modelcontextprotocol/sdk@^1.29.0 zod@^3.25.0
      - run: pnpm --filter @orb/api typecheck
      - uses: rodkisten/github/src/publish@main
        with:
          app-id: ${{ vars.PLOOCKY_APP_ID }}
          private-key: ${{ secrets.PLOOCKY_PRIVATE_KEY }}
          mode: commit
          branch: feat/workflow-dispatch-mcp
          base-branch: feat/workflow-dispatch-mcp
          commit-message: "build(api): install MCP SDK and lock dependencies [deploy]"
