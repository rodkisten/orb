name: DELETE ME - MCP dependencies
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/workflow-dispatch-mcp'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm --filter ./apps/api add @modelcontextprotocol/sdk@^1.29.0 zod@^3.25.0
      - run: pnpm --filter ./apps/api typecheck
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/package.json pnpm-lock.yaml
          git commit -m 'build(api): install MCP SDK and lock dependencies' || exit 1
          git push
