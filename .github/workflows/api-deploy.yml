name: 🪐 Deploy API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orb-api-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 12.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify release build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @orb/api typecheck
          node --experimental-strip-types --test apps/api/tests/*.test.mjs
          pnpm --filter @orb/api exec wrangler deploy --dry-run

      - name: Verify Access, migrate D1, deploy and check health
        env:
          FORCE_COLOR: "1"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_APP_ID: ${{ vars.CF_ACCESS_APP_ID }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ORB_INGEST_TOKEN: ${{ secrets.ORB_INGEST_TOKEN }}
          ORB_WEBHOOK_SECRET: ${{ secrets.ORB_WEBHOOK_SECRET }}
          ORB_CI_READ_TOKEN: ${{ secrets.ORB_CI_READ_TOKEN }}
          ORB_CI_REPOSITORIES: ${{ vars.ORB_CI_REPOSITORIES }}
          ORB_GITHUB_APP_ID: ${{ vars.ORB_GITHUB_APP_ID }}
          ORB_GITHUB_APP_INSTALLATION_ID: ${{ vars.ORB_GITHUB_APP_INSTALLATION_ID }}
          ORB_GITHUB_APP_PRIVATE_KEY: ${{ secrets.ORB_GITHUB_APP_PRIVATE_KEY }}
        run: node scripts/api-deploy.mjs
