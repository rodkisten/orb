name: 🪐 ORB · PR preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
concurrency:
  group: orb-preview-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.action != 'closed' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve current PR
        id: pr
        run: |
          [[ "$PR" =~ ^[1-9][0-9]*$ ]]
          gh pr view "$PR" --json headRefOid,isCrossRepository,state > /tmp/pr.json
          jq -e '.state == "OPEN" and .isCrossRepository == false' /tmp/pr.json
          sha=$(jq -r .headRefOid /tmp/pr.json)
          git fetch origin "$sha"
          git checkout --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orb/api typecheck && pnpm --filter @orb/web build
      - name: Deploy isolated API and frontend
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          ORB_GITHUB_APP_ID: ${{ vars.ORB_GITHUB_APP_ID }}
          ORB_GITHUB_APP_INSTALLATION_ID: ${{ vars.ORB_GITHUB_APP_INSTALLATION_ID }}
          ORB_GITHUB_APP_PRIVATE_KEY: ${{ secrets.ORB_GITHUB_APP_PRIVATE_KEY }}
          ORB_CI_READ_TOKEN: ${{ secrets.ORB_CI_READ_TOKEN }}
          ORB_CI_REPOSITORIES: ${{ vars.ORB_CI_REPOSITORIES }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          current=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          if [[ "$current" != "$(git rev-parse HEAD)" ]]; then
            echo "::notice::Preview superseded by newer PR commit $current"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::group::Generate preview configuration"
          node --check scripts/preview-config.mjs
          echo "::endgroup::"
          node scripts/preview-config.mjs "$PR"
          node scripts/preview-secrets.mjs /tmp/orb-preview-secrets.json
          trap 'rm -f /tmp/orb-preview-secrets.json' EXIT
          pnpm --filter @orb/api exec wrangler deploy --config wrangler.preview.json --secrets-file /tmp/orb-preview-secrets.json
          pnpm --filter @orb/api exec wrangler deploy --config ../web/wrangler.preview.json
          url="https://pr$PR.orb.migos.club"
          curl --retry 8 --retry-all-errors --retry-max-time 180 -fsS -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" "$url/api" -o /tmp/orb-preview.html
          curl --retry 8 --retry-all-errors --retry-max-time 180 -fsS -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" "https://pr$PR.api.orb.migos.club/v1/health" | jq -e '.status == "ok"'
          grep -q 'id="root"' /tmp/orb-preview.html
          curl -fsS -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" "$url/v1/health" | jq -e '.status == "ok"'
      - name: Generate preview report
        if: always() && steps.pr.outputs.sha != '' && steps.deploy.outputs.superseded != 'true'
        env:
          SHA: ${{ steps.pr.outputs.sha }}
          OUTCOME: ${{ steps.deploy.outcome }}
          SUPERSEDED: ${{ steps.deploy.outputs.superseded }}
        run: |
          status=failure
          if [[ "$OUTCOME" == success ]]; then status=success; fi
          jq -n --arg sha "$SHA" --arg status "$status" --arg url "https://pr$PR.orb.migos.club/api" '{title:"🪐 Orb preview",sha:$sha,status:$status,url:$url,description:"API Lab · real API through authenticated gateway",links:[{label:"API Lab",url:$url},{label:"API health",url:($url|sub("\\.orb\\.migos\\.club/api$";".api.orb.migos.club/v1/health"))}]}' > /tmp/orb-report.json
      - uses: rodkisten/github/preview-report@main
        if: always() && steps.pr.outputs.sha != '' && steps.deploy.outputs.superseded != 'true'
        with:
          github-token: ${{ github.token }}
          pr-number: ${{ env.PR }}
          results-file: /tmp/orb-report.json
  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - name: Delete preview worker
        env:
          PR: ${{ github.event.pull_request.number }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/preview-config.mjs "$PR"
          pnpm --filter @orb/api exec wrangler delete --config ../web/wrangler.preview.json --force
          pnpm --filter @orb/api exec wrangler delete --config wrangler.preview.json --force
