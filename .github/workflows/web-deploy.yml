name: 🪐 Web deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orb-web-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - name: Build and typecheck frontend
        run: pnpm --filter @orb/web build
      - name: Deploy frontend
        working-directory: apps/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @orb/api exec wrangler deploy --config ../web/wrangler.jsonc
      - name: Verify domain
        run: |
          curl --retry 5 --retry-all-errors --fail --silent --show-error --output /dev/null https://orb.migos.club/
