name: 🪐 ORB · Format
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orb-format-${{ github.ref }}
  cancel-in-progress: false
jobs:
  format:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[format]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - run: pnpm typecheck
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: format workspace [format] [deploy]'
          git push
