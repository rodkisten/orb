name: 🪐 ORB · Format
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orb-format-${{ github.ref }}
  cancel-in-progress: false
jobs:
  format:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[format]')
    runs-on: ubuntu-latest
    steps:
      - uses: rodkisten/github/app-token@main
        id: app
        with:
          app-id: ${{ vars.ORB_GITHUB_APP_ID }}
          private-key: ${{ secrets.ORB_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.app.outputs.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - run: pnpm typecheck
      - name: Commit formatting
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          bot="$APP_SLUG[bot]"
          id=$(gh api "users/$bot" --jq .id)
          git config user.name "$bot"
          git config user.email "$id+$bot@users.noreply.github.com"
          git add -u
          git add pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: format workspace [format] [deploy]'
          git push
