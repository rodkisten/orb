name: Orb workspace setup
description: Configure pinned Node and pnpm and optionally install workspace
inputs:
  install:
    description: Install frozen workspace
    default: "true"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.22.0
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: pnpm
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
